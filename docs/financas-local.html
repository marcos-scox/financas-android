<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FinAI · Finanças pessoais</title>
<style>
:root{
  --fundo:#0F172A; --vidro:rgba(148,163,184,.075); --vidro-2:rgba(148,163,184,.035);
  --borda:rgba(148,163,184,.16);
  --mint:#10B981; --azul:#3B82F6; --violeta:#8B5CF6; --rosa:#F43F5E;
  --texto:#E2E8F0; --fraco:#94A3B8; --fraco-2:#64748B;
  --mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh; font-family:var(--sans); color:var(--texto); -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 500px at 12% -8%, rgba(59,130,246,.14), transparent 60%),
    radial-gradient(700px 420px at 92% 4%, rgba(139,92,246,.12), transparent 62%),
    var(--fundo);
  background-attachment:fixed;
  display:flex;
}
button,input,textarea,select{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

/* nav lateral */
.nav{width:246px;flex:0 0 246px;padding:26px 18px;border-right:1px solid var(--borda);
  background:linear-gradient(180deg,rgba(148,163,184,.05),transparent);display:flex;flex-direction:column;gap:26px;
  position:sticky;top:0;height:100vh}
.marca{display:flex;align-items:center;gap:11px}
.marca-selo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--azul),var(--violeta));font:600 13px/1 var(--mono);color:#fff}
.marca strong{display:block;font-size:15px;letter-spacing:-.01em}
.marca span{display:block;font-size:11px;color:var(--fraco-2)}
.nav nav{display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid transparent;
  background:none;color:var(--fraco);font:500 13.5px var(--sans);cursor:pointer;text-align:left;transition:background .16s,color .16s}
.nav-item:hover{background:var(--vidro-2);color:var(--texto)}
.nav-item.ativo{background:var(--vidro);border-color:var(--borda);color:var(--texto)}
.nav-item.ativo svg{color:var(--azul)}
.btn-calc{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;
  border-radius:11px;border:1px solid rgba(59,130,246,.42);background:rgba(59,130,246,.13);color:#BFDBFE;
  font:600 13px var(--sans);cursor:pointer}
.btn-calc:hover{background:rgba(59,130,246,.22)}

/* conteúdo */
.conteudo{flex:1;padding:34px 34px 90px;min-width:0}
.topo{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px}
.topo .btn-calc{margin:0;padding:10px 16px}
h1{margin:4px 0 6px;font-size:27px;font-weight:600;letter-spacing:-.025em}
h2{margin:2px 0 0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.eyebrow{margin:0;font:500 10.5px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--fraco-2)}
.sub{margin:8px 0 0;font-size:13px;line-height:1.55;color:var(--fraco)}

.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.cartao{background:linear-gradient(155deg,var(--vidro),var(--vidro-2));border:1px solid var(--borda);
  border-radius:18px;padding:20px 22px;backdrop-filter:blur(14px)}
.cartao.largo{grid-column:1/-1}
.cartao.destaque{grid-column:span 2}
.cabec-linha{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}

.numero-gigante{font:600 40px/1.1 var(--mono);letter-spacing:-.035em;margin:10px 0 0;font-variant-numeric:tabular-nums}
.numero-medio{font:600 25px/1.2 var(--mono);letter-spacing:-.03em;margin:8px 0 0;font-variant-numeric:tabular-nums}
.numero-medio small{font-size:12px;letter-spacing:0;color:var(--fraco-2);margin-left:6px;font-weight:500}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
.mono.forte{font-weight:600;color:var(--texto)}
.mint{color:var(--mint)}.rosa{color:var(--rosa)}.azul{color:var(--azul)}

.fita{display:flex;height:9px;border-radius:99px;overflow:hidden;margin:20px 0 12px;background:rgba(148,163,184,.1)}
.fita-seg{transition:width .7s cubic-bezier(.22,1,.36,1)}
.fita-seg.mint{background:var(--mint)}.fita-seg.azul{background:var(--azul)}.fita-seg.rosa{background:var(--rosa)}
.legenda{display:flex;flex-wrap:wrap;gap:16px;font:400 12px var(--sans);color:var(--fraco)}
.pt{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:6px}
.pt.mint{background:var(--mint)}.pt.azul{background:var(--azul)}.pt.rosa{background:var(--rosa)}

.horizonte{display:flex;gap:8px;align-items:flex-end;height:180px;margin:6px 0 14px}
.hz-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.hz-valor{font:500 10px var(--mono);color:var(--fraco-2);height:14px}
.hz-trilho{flex:1;width:100%;display:flex;align-items:flex-end;background:rgba(148,163,184,.06);border-radius:7px 7px 3px 3px}
.hz-barra{width:100%;border-radius:7px 7px 3px 3px;min-height:2px;transform-origin:bottom;
  background:linear-gradient(180deg,rgba(59,130,246,.95),rgba(139,92,246,.55));animation:sobe .6s cubic-bezier(.22,1,.36,1) backwards}
@keyframes sobe{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.hz-rot{font:400 10px var(--mono);color:var(--fraco-2);margin-top:8px}
.tag{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--fraco);
  border:1px solid var(--borda);padding:5px 9px;border-radius:99px;white-space:nowrap}

.trilho{height:7px;border-radius:99px;background:rgba(148,163,184,.12);overflow:hidden;margin:10px 0}
.trilho.fino{height:5px}
.preenche{height:100%;border-radius:99px;transition:width .55s cubic-bezier(.22,1,.36,1)}
.preenche.violeta{background:linear-gradient(90deg,var(--violeta),#A78BFA)}
.preenche.azul{background:linear-gradient(90deg,var(--azul),#60A5FA)}

.lista-metas{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.meta-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px}
.meta-cab em{color:var(--fraco-2);font-style:normal}
.folego.alerta{border-color:rgba(244,63,94,.35)}
.aviso{display:flex;align-items:center;gap:8px;margin-top:14px;padding:9px 11px;border-radius:10px;
  background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.28);color:#FDA4AF;font-size:12.5px}
.aviso svg{flex:0 0 auto}
.ok{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.28);color:#6EE7B7}

.lista-contas{display:flex;flex-direction:column;gap:2px;margin:16px 0}
.conta-linha{display:grid;grid-template-columns:30px 1fr auto 28px;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid rgba(148,163,184,.09)}
.conta-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--vidro);color:var(--fraco)}
.conta-txt strong{display:block;font-size:13.5px;font-weight:500}
.conta-txt span{font-size:11.5px;color:var(--fraco-2)}
.tabela{display:flex;flex-direction:column;gap:12px}
.despesa{border:1px solid var(--borda);border-radius:14px;padding:15px 16px;background:var(--vidro-2)}
.despesa-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.despesa-topo strong{font-size:14px;font-weight:500}
.categoria{display:block;font:400 11.5px var(--sans);color:var(--fraco-2);margin-top:2px}
.despesa-valor{text-align:right}
.despesa-valor em{display:block;font:400 10.5px var(--sans);font-style:normal;color:var(--fraco-2);margin-top:2px}
.despesa-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--fraco);flex-wrap:wrap}
.stepper{margin-left:auto;display:flex;gap:4px}
.stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--borda);background:var(--vidro);
  color:var(--fraco);cursor:pointer;display:grid;place-items:center;font-size:14px;line-height:1}
.stepper button:hover{color:var(--mint);border-color:rgba(16,185,129,.4)}
.docs{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;cursor:pointer;
  border:1px solid var(--borda);background:var(--vidro);color:var(--fraco);font:400 11.5px var(--sans)}
.chip:hover{color:var(--texto)}
.chip.anexar{border-style:dashed}
.chip input{display:none}
.chip-x{color:var(--fraco-2);font-size:15px;line-height:1;padding:0 2px}
.chip-x:hover{color:var(--rosa)}
.icone{background:none;border:none;color:var(--fraco-2);cursor:pointer;padding:6px;border-radius:7px;display:inline-grid;place-items:center}
.icone:hover{color:var(--rosa);background:rgba(244,63,94,.1)}
.icone.recuo{margin-left:auto}
.inv-linha,.sug-linha{display:grid;grid-template-columns:1fr auto auto 30px;align-items:center;gap:12px;
  padding:12px 14px;border:1px solid var(--borda);border-radius:12px;background:var(--vidro-2)}
.inv-linha strong,.sug-linha strong{font-size:13.5px;font-weight:500}
.pill{padding:3px 9px;border-radius:99px;font-size:12px}
.pill.up{background:rgba(16,185,129,.13);color:var(--mint)}
.pill.down{background:rgba(244,63,94,.13);color:var(--rosa)}
.meta-card{border:1px solid var(--borda);border-radius:14px;padding:16px;background:var(--vidro-2)}
.meta-rodape{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--fraco);flex-wrap:wrap}
.aporte{display:flex;align-items:center;gap:10px;margin-top:12px}
.aporte input{width:130px}
.dica{font-size:11px;color:var(--fraco-2)}

input,textarea{background:rgba(15,23,42,.55);border:1px solid var(--borda);border-radius:10px;
  padding:10px 11px;color:var(--texto);font:400 13px var(--sans);width:100%}
input::placeholder,textarea::placeholder{color:var(--fraco-2)}
.form-inline{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:8px;margin-top:14px}
.form-inline.quatro{grid-template-columns:1.3fr 1fr 1fr 1fr auto}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo span{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--fraco-2)}
.campo em{font:400 11px var(--sans);font-style:normal;color:var(--fraco-2)}
.campo.cheio{grid-column:1/-1}
.btn-primario,.btn-secundario{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 15px;border-radius:10px;font:600 12.5px var(--sans);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-primario{background:linear-gradient(135deg,var(--azul),#6366F1);border:1px solid rgba(99,102,241,.6);color:#fff}
.btn-primario:hover{filter:brightness(1.1)}
.btn-primario:disabled,.btn-secundario:disabled{opacity:.55;cursor:default;filter:none}
.btn-secundario{background:var(--vidro);border:1px solid var(--borda);color:var(--texto)}
.btn-secundario:hover{background:rgba(148,163,184,.14)}
.btn-perigo{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.35);color:#FDA4AF}
.link{background:none;border:none;color:var(--azul);font:500 12.5px var(--sans);cursor:pointer;padding:0;
  margin-top:12px;display:inline-flex;align-items:center;gap:5px}
.mini-stats{display:flex;gap:26px;margin-top:18px}
.mini-stats span{display:block;margin-bottom:4px}

.nota{min-height:130px;margin-top:14px;resize:vertical;line-height:1.6}
.acoes-ia{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}
.analise{border-color:rgba(59,130,246,.3)}
.md h3{font-size:14.5px;margin:16px 0 6px;letter-spacing:-.01em}
.md h4{font-size:13px;margin:14px 0 5px;color:var(--fraco)}
.md p{font-size:13.5px;line-height:1.62;color:#CBD5E1;margin:8px 0}
.md ul{margin:8px 0;padding-left:18px}
.md li{font-size:13.5px;line-height:1.6;color:#CBD5E1;margin:5px 0}
.md strong{color:var(--texto)}
.md code{font-family:var(--mono);font-size:12.5px;background:rgba(148,163,184,.12);padding:1px 5px;border-radius:5px}

.overlay{position:fixed;inset:0;background:rgba(2,6,23,.72);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:20px;z-index:60}
.modal{width:min(580px,100%);max-height:86vh;overflow:auto;background:#111C33;border:1px solid var(--borda);
  border-radius:18px;padding:22px}
.modal-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-topo h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.modal-acoes{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.bal-linha{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(148,163,184,.1);
  font-size:13.5px;color:var(--fraco)}
.bal-total{display:flex;justify-content:space-between;align-items:center;padding:16px 0 12px;font-size:14px}
.bal-total strong{font-size:22px;font-family:var(--mono);letter-spacing:-.03em}
.bal-notas{border-top:1px solid rgba(148,163,184,.1);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.bal-notas p{margin:0;font-size:12.5px;color:var(--fraco)}
.doc-preview{width:100%;border-radius:12px;display:block}
.doc-pdf{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px;color:var(--fraco);text-align:center}

.vazio{border:1px dashed var(--borda);border-radius:20px;padding:52px 26px;text-align:center;max-width:520px;margin:34px auto}
.vazio-selo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;margin:0 auto 18px;
  background:var(--vidro);border:1px solid var(--borda);color:var(--azul)}
.vazio h2{font-size:19px;margin-bottom:8px}
.vazio p{font-size:13.5px;color:var(--fraco);line-height:1.6;margin:0 auto;max-width:380px}
.vazio-acoes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#111C33;border:1px solid var(--borda);
  padding:11px 18px;border-radius:12px;font-size:13px;z-index:70;box-shadow:0 12px 34px rgba(0,0,0,.5);max-width:88vw;text-align:center}
.girar{animation:girar 1s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.pasta-status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--vidro-2);
  border:1px solid var(--borda);margin-top:14px;font-size:12.5px;color:var(--fraco);flex-wrap:wrap}
.pasta-status strong{color:var(--texto);font-family:var(--mono);font-size:12.5px}

.tabbar{display:none}
@media (max-width:980px){
  .grade{grid-template-columns:1fr 1fr}
  .cartao.destaque{grid-column:1/-1}
  .form-inline,.form-inline.quatro{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  body{flex-direction:column}
  .nav{display:none}
  .conteudo{padding:20px 15px calc(96px + env(safe-area-inset-bottom))}
  .grade{grid-template-columns:1fr}
  .campos{grid-template-columns:1fr}
  .form-inline,.form-inline.quatro{grid-template-columns:1fr}
  h1{font-size:22px}
  .numero-gigante{font-size:31px}
  .mobile-hide{display:none}
  .horizonte{height:150px;gap:5px}
  .hz-valor{display:none}
  .inv-linha,.sug-linha{grid-template-columns:1fr auto;row-gap:8px}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(11,17,32,.94);
    backdrop-filter:blur(14px);border-top:1px solid var(--borda);padding:9px 6px calc(12px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;background:none;border:none;color:var(--fraco-2);padding:8px;cursor:pointer}
  .tabbar button.ativo{color:var(--azul)}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<aside class="nav">
  <div class="marca">
    <div class="marca-selo">FA</div>
    <div><strong>FinAI</strong><span>Tudo neste aparelho</span></div>
  </div>
  <nav id="menu"></nav>
  <button class="btn-calc" data-act="balanco">${''}</button>
</aside>
<main class="conteudo">
  <header class="topo">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="titulo"></h1>
      <p class="sub" id="subtitulo"></p>
    </div>
    <button class="btn-calc mobile-hide" data-act="balanco">Calcular tudo</button>
  </header>
  <div id="painel"></div>
</main>
<nav class="tabbar" id="tabbar"></nav>
<div id="modais"></div>
<div id="toasts"></div>

<script>
/* =================================================================
   FinAI — app local. Nenhum dado sai deste aparelho, exceto o texto
   enviado à IA quando você aperta "Analisar" (e só se configurar uma chave).
   ================================================================= */

  check:'M4 12l5 5L20 6',

  arquivo:'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5zm0 0v5h5',
  pasta:'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z',

  baixar:'M12 3v12m0 0l-4-4m4 4l4-4M4 19h16'
};
const ico = (n,s=16)=>'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONES[n].split('M').filter(Boolean).map(d=>'<path d="M'+d+'"/>').join('')+'</svg>';

/* ---------- utilidades ---------- */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brlCurto = n => { const v=Number(n)||0; return Math.abs(v)>=1000 ? 'R$ '+(v/1000).toFixed(1).replace('.',',')+'k' : 'R$ '+v.toFixed(0); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num = v => { if(typeof v==='number') return v; const s=String(v??'').replace(/\./g,'').replace(',','.').replace(/[^\d.-]/g,''); const n=parseFloat(s); return isNaN(n)?0:n; };
const hojeMes = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
const mesIdx = ym => { const [a,m]=String(ym||hojeMes()).split('-').map(Number); return a*12+(m-1); };
const rotMes = i => ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][i%12]+'/'+String(Math.floor(i/12)).slice(2);

/* ---------- IndexedDB (armazenamento do aparelho) ---------- */
const IDB = {
  db:null,
  abrir(){
    return new Promise((ok,err)=>{
      const r = indexedDB.open('finai',1);
      r.onupgradeneeded = e => { const d=e.target.result; if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if(!d.objectStoreNames.contains('docs')) d.createObjectStore('docs'); };
      r.onsuccess = e => { IDB.db=e.target.result; ok(); };
      r.onerror = () => err(new Error('Não foi possível abrir o armazenamento do aparelho'));
    });
  },
  op(loja,modo,fn){
    return new Promise((ok,err)=>{
      const t = IDB.db.transaction(loja,modo); const s = t.objectStore(loja); const req = fn(s);
      req.onsuccess = () => ok(req.result); req.onerror = () => err(req.error);
    });
  },
  get:(l,k)=>IDB.op(l,'readonly',s=>s.get(k)),
  set:(l,k,v)=>IDB.op(l,'readwrite',s=>s.put(v,k)),
  del:(l,k)=>IDB.op(l,'readwrite',s=>s.delete(k)),
  limpar:l=>IDB.op(l,'readwrite',s=>s.clear())
};

/* ---------- cálculos ---------- */
function calcular(){
  const saldo = S.contas.reduce((a,c)=>a+num(c.saldo),0);
  const atual = S.investimentos.reduce((a,i)=>a+num(i.atual),0);
  const aplicado = S.investimentos.reduce((a,i)=>a+num(i.aplicado),0);
  let divida=0, mensal=0;
  S.despesas.forEach(d=>{
    const vp=num(d.valorParcela), t=+d.parcelasTotal||0, p=+d.parcelasPagas||0;
    if(t>0){ divida += vp*Math.max(0,t-p); if(p<t) mensal+=vp; } else mensal+=vp;
  });
  const base = mesIdx(hojeMes());
  const horizonte = Array.from({length:12},(_,k)=>{
    const alvo=base+k; let v=0;
    S.despesas.forEach(d=>{
      const vp=num(d.valorParcela), t=+d.parcelasTotal||0, p=+d.parcelasPagas||0;
      if(t>0){ const n = alvo - mesIdx(d.primeira) + 1; if(n>p && n<=t) v+=vp; } else v+=vp;
    });
    return {rot:rotMes(alvo), valor:v};
  });
  return { saldo, atual, aplicado, rendimento:atual-aplicado, divida, mensal, horizonte,
           patrimonio:saldo+atual-divida, folego: mensal>0 ? saldo/mensal : null,
           metaAlvo:S.metas.reduce((a,m)=>a+num(m.alvo),0), metaAcum:S.metas.reduce((a,m)=>a+num(m.acumulado),0) };
}

const suportaPasta = () => typeof window.showDirectoryPicker === 'function';

async function escolherPasta(){
  if(!suportaPasta()){ avisar('Este navegador não permite escolher pasta. Os comprovantes ficam guardados dentro do app, no aparelho.'); return; }
  try{
    const h = await window.showDirectoryPicker({ mode:'readwrite', id:'finai-comprovantes' });
    pasta = h; pastaOk = true;
    await IDB.set('kv','pasta',h);
    avisar('Pasta conectada: '+h.name); render();
  }catch(e){ if(e.name!=='AbortError') avisar('Não foi possível abrir a pasta.'); }
}
async function reconectarPasta(){
  if(!pasta) return false;
  const p = await pasta.requestPermission({mode:'readwrite'});
  pastaOk = p==='granted';
  if(pastaOk) avisar('Pasta reconectada'); render();
  return pastaOk;
}
async function recuperarPasta(){
  try{
    const h = await IDB.get('kv','pasta');
    if(!h) return;
    pasta = h;
    pastaOk = (await h.queryPermission({mode:'readwrite'})) === 'granted';
  }catch(e){}
}
async function gravarNaPasta(nome, blob){
  const fh = await pasta.getFileHandle(nome,{create:true});
  const w = await fh.createWritable();
  await w.write(blob); await w.close();
}

/* ---------- comprovantes ---------- */
async function anexar(despesaId, file){
  if(!file) return;
  if(file.size > 8*1024*1024){ avisar('Arquivo acima de 8 MB. Comprima antes de anexar.'); return; }
  const id = uid();
  const ext = (file.name.match(/\.[a-z0-9]+$/i)||[''])[0] || (file.type==='application/pdf'?'.pdf':'.jpg');
  const limpo = (S.despesas.find(d=>d.id===despesaId)?.nome||'comprovante').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').slice(0,28);
  const nomeArq = limpo+'-'+new Date().toISOString().slice(0,10)+'-'+id.slice(-4)+ext;
  let onde = 'app';
  try{
    if(pasta && pastaOk){ await gravarNaPasta(nomeArq, file); onde='pasta'; }
    else { await IDB.set('docs', id, file); }
  }catch(e){ await IDB.set('docs', id, file); onde='app'; avisar('Não consegui gravar na pasta. Guardei dentro do app.'); }
  mutar(s=>{ const d = s.despesas.find(x=>x.id===despesaId); d.docs=d.docs||[]; d.docs.push({id, nome:file.name, arquivo:nomeArq, tipo:file.type, onde}); });
  avisar(onde==='pasta' ? 'Salvo na pasta como '+nomeArq : 'Comprovante salvo no aparelho');
}
async function abrirDoc(despesaId, docId){
  const d = S.despesas.find(x=>x.id===despesaId); const f = (d.docs||[]).find(x=>x.id===docId);
  let blob = null;
  try{
    if(f.onde==='pasta'){
      if(!pastaOk && !(await reconectarPasta())) { avisar('Reconecte a pasta em Ajustes para ver este arquivo.'); return; }
      blob = await (await pasta.getFileHandle(f.arquivo)).getFile();
    } else blob = await IDB.get('docs', f.id);
  }catch(e){ avisar('Arquivo não encontrado. Ele pode ter sido movido ou renomeado na pasta.'); return; }
  if(!blob){ avisar('Arquivo não encontrado.'); return; }
  const url = URL.createObjectURL(blob);
  modal(esc(f.nome), (f.tipo||'').startsWith('image/')
    ? '<img class="doc-preview" src="'+url+'" alt="">'
    : '<div class="doc-pdf">'+ico('arquivo',30)+'<p>Comprovante em PDF.</p><a class="btn-secundario" href="'+url+'" download="'+esc(f.nome)+'">'+ico('baixar',14)+' Abrir / baixar</a></div>');
}
async function removerDoc(despesaId, docId){
  const d = S.despesas.find(x=>x.id===despesaId); const f=(d.docs||[]).find(x=>x.id===docId);
  try{ if(f.onde==='pasta' && pasta && pastaOk) await pasta.removeEntry(f.arquivo); else await IDB.del('docs', f.id); }catch(e){}
  mutar(s=>{ const x=s.despesas.find(y=>y.id===despesaId); x.docs=(x.docs||[]).filter(y=>y.id!==docId); });
}

async function exportarBackup(){
  const dados = JSON.stringify({versao:1, exportadoEm:new Date().toISOString(), dados:{...S, cfg:{...S.cfg, chave:''}}}, null, 2);
  const blob = new Blob([dados],{type:'application/json'});
  const nome = 'finai-backup-'+new Date().toISOString().slice(0,10)+'.json';
  if(pasta && pastaOk){ try{ await gravarNaPasta(nome, blob); avisar('Backup gravado na pasta'); return; }catch(e){} }
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome; a.click();
  avisar('Backup baixado');
}
async function importarBackup(file){
  try{
    const txt = await file.text(); const j = JSON.parse(txt);
    const d = j.dados||j;
    S = { ...S, ...d, cfg:{...S.cfg, ...(d.cfg||{}), chave:S.cfg.chave} };
    salvar(); render(); avisar('Backup restaurado');
  }catch(e){ avisar('Arquivo de backup inválido'); }
}

const SYSTEM_FINAI = `Você é o FinAI, um assistente financeiro pessoal de elite.
Sua missão é analisar as anotações do usuário, comparar com o saldo de contas, parcelas pendentes e investimentos cadastrados, e fornecer conselhos práticos e diretos.

Diretrizes:

Seja específico com números. Não invente dados fora do resumo enviado. Máximo 400 palavras.`;

async function ia(system, user){
  const c = S.cfg;
  if(!c.chave) throw new Error('Configure a chave da IA em Ajustes.');
  const r = await fetch(c.endpoint,{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.chave},
    body:JSON.stringify({
      model:c.modelo, temperature:0.3, max_tokens:1200,
      messages:[{role:'system',content:system},{role:'user',content:user}]
    })});
  if(!r.ok) throw new Error('A IA respondeu com erro '+r.status+(r.status===401?' — chave inválida.':''));
  const j = await r.json();
  const txt = j?.choices?.[0]?.message?.content ?? j?.resposta ?? j?.output ?? j?.text;
  if(!txt) throw new Error('Resposta da IA em formato inesperado.');
  return String(txt).trim();
}
function resumoParaIA(c){
  return JSON.stringify({
    saldoEmConta:c.saldo, compromissoMensal:c.mensal, totalAindaAPagar:c.divida,
    mesesDeFolego: c.folego===null?null:+c.folego.toFixed(1),
    investimentos:S.investimentos.map(i=>({nome:i.nome,tipo:i.tipo,aplicado:num(i.aplicado),atual:num(i.atual)})),
    parcelamentos:S.despesas.map(d=>({nome:d.nome,categoria:d.categoria,valorParcela:num(d.valorParcela),pagas:+d.parcelasPagas||0,total:+d.parcelasTotal||0})),
    metas:S.metas.map(m=>({nome:m.nome,alvo:num(m.alvo),acumulado:num(m.acumulado),prazo:m.prazo})),
    proximos12Meses:c.horizonte.map(h=>({mes:h.rot,comprometido:+h.valor.toFixed(2)}))
  },null,1);
}
function markdown(t){
  const linhas = esc(t).split('\n'); let out=[], li=[];
  const fecha=()=>{ if(li.length){ out.push('<ul>'+li.map(x=>'<li>'+x+'</li>').join('')+'</ul>'); li=[]; } };
  const inl = s => s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
  linhas.forEach(l=>{ const t2=l.trim();
    if(/^#{1,6}\s/.test(t2)){ fecha(); const n=t2.match(/^#+/)[0].length; const T=n<=2?'h3':'h4'; out.push('<'+T+'>'+inl(t2.replace(/^#+\s/,''))+'</'+T+'>'); }
    else if(/^[-*•]\s/.test(t2)) li.push(inl(t2.replace(/^[-*•]\s/,'')));
    else if(/^\d+[.)]\s/.test(t2)) li.push(inl(t2.replace(/^\d+[.)]\s/,'')));
    else if(!t2) fecha();
    else { fecha(); out.push('<p>'+inl(t2)+'</p>'); }
  });
  fecha(); return '<div class="md">'+out.join('')+'</div>';
}

              <button data-act="parcela" data-id="${d.id}" data-d="1" aria-label="Marcar paga">${ico('check',13)}</button>
            </div>
          </div>`:''}
          <div class="docs">
            ${(d.docs||[]).map(f=>`<span class="chip" data-act="abrir-doc" data-id="${d.id}" data-doc="${f.id}">
              ${ico(f.onde==='pasta'?'pasta':'arquivo',12)} ${esc(f.nome.length>22?f.nome.slice(0,20)+'…':f.nome)}
              <span class="chip-x" data-act="del-doc" data-id="${d.id}" data-doc="${f.id}">×</span></span>`).join('')}
            <label class="chip anexar">${ico('clipe',12)} Anexar comprovante
              <input type="file" accept="image/*,application/pdf" data-anexo="${d.id}"></label>
            <button class="icone recuo" data-act="del-despesa" data-id="${d.id}" aria-label="Remover">${ico('lixo',14)}</button>
          </div>
        </div>`;
      }).join('')+'</div>'}
      <div class="pasta-status">
        ${ico('pasta',15)}
        ${pasta && pastaOk ? '<span>Comprovantes vão para a pasta <strong>'+esc(pasta.name)+'</strong></span>'
          : pasta ? '<span>Pasta <strong>'+esc(pasta.name)+'</strong> desconectada.</span><button class="btn-secundario" data-act="reconectar">Reconectar</button>'
          : '<span>Comprovantes guardados dentro do app, neste aparelho.</span>'+(suportaPasta()?'<button class="btn-secundario" data-act="pasta">Escolher pasta</button>':'')}
      </div>
    </section>
  </div>`;
}

function telaInv(c){
  return `
  <div class="grade">
    <section class="cartao">
      <p class="eyebrow">Valor de carteira</p>
      <div class="numero-medio mint">${brl(c.atual)}</div>
      <p class="sub">Aplicado ${brl(c.aplicado)}</p>
    </section>
    <section class="cartao">
      <p class="eyebrow">Resultado</p>
      <div class="numero-medio" style="color:${c.rendimento>=0?'var(--mint)':'var(--rosa)'}">${c.aplicado>0?(c.rendimento/c.aplicado*100).toFixed(1).replace('.',','):'0,0'}%</div>
      <p class="sub">${c.rendimento>=0?'+':''}${brl(c.rendimento)} desde a aplicação</p>
    </section>
    <section class="cartao largo">
      <div class="cabec-linha"><div><p class="eyebrow">Carteira</p><h2>Posições cadastradas</h2></div></div>

        ${S.investimentos.map(i=>{
          const res=num(i.atual)-num(i.aplicado), pct=num(i.aplicado)>0?res/num(i.aplicado)*100:0;

            <span class="mono">${brl(i.atual)}</span>

            <button class="icone" data-act="del-inv" data-id="${i.id}" aria-label="Remover">${ico('lixo',14)}</button>

        <input id="i-tipo" placeholder="Tipo">
        <input id="i-aplicado" placeholder="Aplicado" inputmode="decimal">
        <input id="i-atual" placeholder="Valor hoje" inputmode="decimal">
        <button class="btn-secundario" data-act="add-inv">${ico('mais',15)} Adicionar</button>
      </div>
    </section>
  </div>`;
}

function telaMetas(){
  return `
  <div class="grade">
    <section class="cartao largo">
      <div class="cabec-linha"><div><p class="eyebrow">Objetivos</p><h2>O quanto falta para cada meta</h2></div></div>
      <div class="tabela">
        ${S.metas.map(m=>{
          const pc=Math.min(100,num(m.acumulado)/Math.max(1,num(m.alvo))*100), falta=Math.max(0,num(m.alvo)-num(m.acumulado));
          return `<div class="meta-card">
            <div class="meta-cab">
              <div><strong>${esc(m.nome)}</strong><span class="categoria">${m.prazo?'Prazo '+esc(m.prazo):'Sem prazo'}</span></div>
              <button class="icone" data-act="del-meta" data-id="${m.id}" aria-label="Remover">${ico('lixo',14)}</button>
            </div>
            <div class="trilho"><div class="preenche violeta" style="width:${pc}%"></div></div>
            <div class="meta-rodape"><span class="mono forte">${pc.toFixed(0)}%</span>
              <span class="mono">${brl(m.acumulado)} de ${brl(m.alvo)}</span><span>Faltam ${brl(falta)}</span></div>
            <div class="aporte"><input placeholder="Aportar" inputmode="decimal" data-aporte="${m.id}"><span class="dica">Enter para somar</span></div>
          </div>`;
        }).join('') || '<p class="sub">Nenhuma meta ainda. Uma boa primeira: reserva de emergência de 6 meses de despesas.</p>'}
      </div>
      <div class="form-inline quatro">
        <input id="m-nome" placeholder="Meta">
        <input id="m-alvo" placeholder="Valor alvo" inputmode="decimal">
        <input id="m-acum" placeholder="Já acumulado" inputmode="decimal">
        <input id="m-prazo" type="month">
        <button class="btn-secundario" data-act="add-meta">${ico('mais',15)} Criar meta</button>
      </div>
    </section>
  </div>`;
}

  <div class="grade">
    <section class="cartao largo">
      <p class="eyebrow">Bloco de notas</p>
      <h2>Escreva como você falaria</h2>
      <textarea class="nota" id="nota" placeholder="Gastei 320 no mercado ontem. Parcelei uma cadeira em 6x de 210. Recebi um bônus de 3 mil, não sei onde colocar.">${esc(S.nota)}</textarea>
      <div class="acoes-ia">
        <button class="btn-primario" data-act="analisar">${ico('ia',15)} Analisar minhas finanças</button>

      </div>

    <div id="saida-ia" style="display:contents"></div>
    ${S.analises.map(a=>`<section class="cartao largo analise">

      ${markdown(a.texto)}

}

function telaCfg(){
  return `
  <div class="grade">
    <section class="cartao largo">
      <p class="eyebrow">Comprovantes</p><h2>Onde os arquivos ficam guardados</h2>
      <p class="sub">Por padrão os comprovantes ficam dentro do app, no armazenamento deste aparelho. Escolhendo uma pasta, cada arquivo é gravado nela com nome legível — e você acessa pelo gerenciador de arquivos do celular, sem depender do app.</p>
      <div class="pasta-status">
        ${ico('pasta',15)}
        ${pasta && pastaOk ? '<span>Pasta ativa: <strong>'+esc(pasta.name)+'</strong></span><button class="btn-secundario" data-act="pasta">Trocar pasta</button>'
          : pasta ? '<span>Pasta <strong>'+esc(pasta.name)+'</strong> precisa de permissão.</span><button class="btn-secundario" data-act="reconectar">Reconectar</button>'
          : suportaPasta() ? '<span>Nenhuma pasta escolhida.</span><button class="btn-secundario" data-act="pasta">Escolher pasta</button>'
          : '<span>Este navegador não oferece seleção de pasta. Os arquivos ficam dentro do app, no aparelho.</span>'}
      </div>
    </section>

    <section class="cartao largo">
      <p class="eyebrow">Backup</p><h2>Levar seus dados para outro aparelho</h2>
      <p class="sub">O backup é um arquivo JSON com contas, despesas, investimentos, metas e anotações. A chave da IA nunca entra no arquivo.</p>
      <div class="acoes-ia">
        <button class="btn-secundario" data-act="exportar">${ico('baixar',14)} Exportar backup</button>
        <label class="btn-secundario">${ico('arquivo',14)} Importar backup<input type="file" accept="application/json" id="imp" style="display:none"></label>
      </div>
    </section>

    <section class="cartao largo">
      <p class="eyebrow">Assistente IA</p><h2>Chave do provedor</h2>
      <div class="campos">
        <label class="campo cheio"><span>Chave da API</span>
          <input id="k-chave" type="password" value="${esc(S.cfg.chave)}" placeholder="cole aqui a sua chave">
          <em>Guardada apenas neste aparelho. Nunca sai daqui, exceto na chamada ao provedor.</em></label>
        <label class="campo"><span>Modelo</span><input id="k-modelo" value="${esc(S.cfg.modelo)}"></label>
        <label class="campo"><span>Endpoint</span><input id="k-endpoint" value="${esc(S.cfg.endpoint)}"></label>
      </div>
      <div class="acoes-ia"><button class="btn-primario" data-act="salvar-cfg">${ico('check',15)} Salvar ajustes</button></div>
    </section>

    <section class="cartao largo">
      <p class="eyebrow">Zona de risco</p><h2>Apagar tudo deste aparelho</h2>
      <p class="sub">Remove contas, despesas, metas, anotações e comprovantes guardados dentro do app. Arquivos já gravados na pasta escolhida não são apagados.</p>
      <div class="acoes-ia"><button class="btn-secundario btn-perigo" data-act="apagar">${ico('lixo',14)} Apagar todos os dados</button></div>
    </section>
  </div>`;
}

function telaVazia(){
  return `<div class="vazio">
    <div class="vazio-selo">${ico('calc',22)}</div>
    <h2>Comece pelo que pesa no mês</h2>
    <p>Cadastre suas contas e parcelamentos para ver patrimônio, fôlego e o horizonte dos próximos 12 meses. Tudo fica guardado neste aparelho.</p>
    <div class="vazio-acoes"><button class="btn-primario" data-act="ir" data-v="contas">Cadastrar minha primeira conta</button></div>
  </div>`;
}

/* ---------- render ---------- */
function render(){
  const c = calcular();
  const t = TELAS[vista];
  document.getElementById('eyebrow').textContent = t.nome;
  document.getElementById('titulo').textContent = t.titulo;
  document.getElementById('subtitulo').textContent = t.sub;

  const chaves = Object.keys(TELAS);
  document.getElementById('menu').innerHTML = chaves.map(k=>
    `<button class="nav-item${vista===k?' ativo':''}" data-act="ir" data-v="${k}">${ico(TELAS[k].icone,17)}<span>${TELAS[k].nome}</span></button>`).join('');
  document.getElementById('tabbar').innerHTML = chaves.map(k=>
    `<button class="${vista===k?'ativo':''}" data-act="ir" data-v="${k}" aria-label="${TELAS[k].nome}">${ico(TELAS[k].icone,19)}</button>`).join('');
  document.querySelector('.nav .btn-calc').innerHTML = ico('calc',16)+' Calcular tudo';

  const vazio = !S.contas.length && !S.despesas.length && !S.investimentos.length && !S.metas.length;
  const painel = document.getElementById('painel');
  if(vazio && (vista==='visao'||vista==='inv')) painel.innerHTML = telaVazia();
  else if(vista==='visao') painel.innerHTML = telaVisao(c);
  else if(vista==='contas') painel.innerHTML = telaContas(c);
  else if(vista==='inv') painel.innerHTML = telaInv(c);
  else if(vista==='metas') painel.innerHTML = telaMetas();
  else if(vista==='ia') painel.innerHTML = telaIA();
  else painel.innerHTML = telaCfg();
}

/* ---------- ações ---------- */
document.addEventListener('click', async e=>{
  const el = e.target.closest('[data-act]');
  if(e.target.closest('[data-stop]') && !el) return;
  if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;

  if(a==='fechar-modal'){ if(e.target.closest('[data-stop]') && el.dataset.act!=='fechar-modal') return; fecharModal(); return; }
  if(a==='ir'){ vista = el.dataset.v; window.scrollTo(0,0); render(); return; }
  if(a==='balanco'){ const c=calcular(); modal('Balanço total',
    `<div>
      <div class="bal-linha"><span>Saldo em conta</span><strong class="mono mint">${brl(c.saldo)}</strong></div>
      <div class="bal-linha"><span>Investimentos hoje</span><strong class="mono mint">${brl(c.atual)}</strong></div>
      <div class="bal-linha"><span>Parcelas em aberto</span><strong class="mono rosa">-${brl(c.divida)}</strong></div>
      <div class="bal-total"><span>Patrimônio líquido</span><strong style="color:${c.patrimonio>=0?'var(--mint)':'var(--rosa)'}">${brl(c.patrimonio)}</strong></div>
      <div class="bal-notas">
        <p>Compromisso deste mês: <strong class="mono">${brl(c.mensal)}</strong></p>
        <p>Fôlego: <strong class="mono">${c.folego===null?'—':c.folego.toFixed(1)+' meses'}</strong></p>
        <p>Metas: <strong class="mono">${brl(c.metaAcum)} de ${brl(c.metaAlvo)}</strong></p>
      </div>
    </div>`); return; }

  if(a==='add-conta'){
    const nome=document.getElementById('c-nome').value.trim(); if(!nome) return;
    mutar(s=>s.contas.push({id:uid(),nome,banco:document.getElementById('c-banco').value.trim(),saldo:num(document.getElementById('c-saldo').value)})); return; }
  if(a==='del-conta'){ mutar(s=>s.contas=s.contas.filter(x=>x.id!==id)); return; }

  if(a==='nova-despesa'){ modal('Nova despesa',
    `<div class="campos">
      <label class="campo"><span>Descrição</span><input id="d-nome" placeholder="Notebook, plano de saúde…"></label>
      <label class="campo"><span>Categoria</span><input id="d-cat" placeholder="Equipamento, saúde, casa…"></label>
      <label class="campo"><span>Valor da parcela</span><input id="d-valor" inputmode="decimal" placeholder="583,25"></label>
      <label class="campo"><span>Total de parcelas</span><input id="d-total" inputmode="numeric" placeholder="12"><em>0 = despesa recorrente</em></label>
      <label class="campo"><span>Parcelas já pagas</span><input id="d-pagas" inputmode="numeric" placeholder="0"></label>
      <label class="campo"><span>Mês da 1ª parcela</span><input id="d-mes" type="month" value="${hojeMes()}"></label>
    </div>`,
    '<button class="btn-secundario" data-act="fechar-modal">Cancelar</button><button class="btn-primario" data-act="salvar-despesa">Salvar despesa</button>'); return; }
  if(a==='salvar-despesa'){
    const nome=document.getElementById('d-nome').value.trim(); if(!nome){ avisar('Descreva a despesa'); return; }
    mutar(s=>s.despesas.push({id:uid(),nome,categoria:document.getElementById('d-cat').value.trim(),
      valorParcela:num(document.getElementById('d-valor').value), parcelasTotal:+document.getElementById('d-total').value||0,
      parcelasPagas:+document.getElementById('d-pagas').value||0, primeira:document.getElementById('d-mes').value||hojeMes(), docs:[]}));
    fecharModal(); return; }
  if(a==='del-despesa'){ mutar(s=>s.despesas=s.despesas.filter(x=>x.id!==id)); return; }
  if(a==='parcela'){ const d=+el.dataset.d; mutar(s=>{ const x=s.despesas.find(y=>y.id===id); const t=+x.parcelasTotal||0;
    x.parcelasPagas=Math.max(0,Math.min(t,(+x.parcelasPagas||0)+d)); }); return; }
  if(a==='abrir-doc'){ abrirDoc(id, el.dataset.doc); return; }
  if(a==='del-doc'){ e.stopPropagation(); removerDoc(id, el.dataset.doc); return; }
  if(a==='pasta'){ escolherPasta(); return; }
  if(a==='reconectar'){ reconectarPasta(); return; }

  if(a==='add-inv'){
    const nome=document.getElementById('i-nome').value.trim(); if(!nome) return;
    mutar(s=>s.investimentos.push({id:uid(),nome,tipo:document.getElementById('i-tipo').value.trim(),
      aplicado:num(document.getElementById('i-aplicado').value), atual:num(document.getElementById('i-atual').value)})); return; }
  if(a==='del-inv'){ mutar(s=>s.investimentos=s.investimentos.filter(x=>x.id!==id)); return; }

  if(a==='add-meta'){
    const nome=document.getElementById('m-nome').value.trim(); if(!nome) return;
    mutar(s=>s.metas.push({id:uid(),nome,alvo:num(document.getElementById('m-alvo').value),
      acumulado:num(document.getElementById('m-acum').value), prazo:document.getElementById('m-prazo').value})); return; }
  if(a==='del-meta'){ mutar(s=>s.metas=s.metas.filter(x=>x.id!==id)); return; }

  if(a==='analisar'){
    el.disabled=true; el.innerHTML='<span class="girar" style="display:inline-flex">'+ico('cfg',15)+'</span> Analisando';
    try{
      const c=calcular();
      const txt = await ia(SYSTEM_FINAI, 'Situação financeira (JSON):\n'+resumoParaIA(c)+'\n\nAnotações do usuário:\n"""'+(S.nota||'(sem anotações)')+'"""\n\nAnalise e aconselhe.');
      mutar(s=>s.analises.unshift({id:uid(),data:new Date().toLocaleString('pt-BR'),texto:txt}));
      S.analises = S.analises.slice(0,8);
    }catch(err){ avisar(err.message); el.disabled=false; el.innerHTML=ico('ia',15)+' Analisar minhas finanças'; }
    return; }
  if(a==='extrair'){
    if(!S.nota.trim()){ avisar('Escreva a anotação primeiro'); return; }
    el.disabled=true; el.textContent='Lendo…';
    try{
      const bruto = await ia('Você extrai dados financeiros estruturados de texto em português. Responda somente JSON válido.',
        'Extraia os gastos citados. Responda APENAS um array JSON, sem markdown e sem crases. Cada item: {"nome":string,"categoria":string,"valorParcela":number,"parcelasTotal":number}. Use parcelasTotal 0 para gasto único ou recorrente. Se nada for identificável, responda [].\n\nTexto: """'+S.nota+'"""');
      const arr = JSON.parse(bruto.replace(/```json|```/g,'').trim());
      if(!Array.isArray(arr)||!arr.length){ avisar('Nenhum gasto identificado'); }
      else modal('Lançamentos encontrados',
        '<div class="tabela">'+arr.map((s,i)=>`<div class="sug-linha">
          <div><strong>${esc(s.nome)}</strong><span class="categoria">${esc(s.categoria||'')}</span></div>
          <span class="mono">${brl(s.valorParcela)}${+s.parcelasTotal>0?' × '+s.parcelasTotal:' /mês'}</span>
          <button class="btn-secundario" data-act="aceitar-sug" data-i="${i}">${ico('check',14)} Adicionar</button>
        </div>`).join('')+'</div>');
      window.__sug = arr;
    }catch(err){ avisar('Não consegui interpretar a anotação. '+err.message); }
    el.disabled=false; el.textContent='Extrair lançamentos do texto'; return; }
  if(a==='aceitar-sug'){
    const s = window.__sug[+el.dataset.i]; if(!s) return;
    mutar(st=>st.despesas.push({id:uid(),nome:s.nome,categoria:s.categoria||'',valorParcela:num(s.valorParcela),
      parcelasTotal:+s.parcelasTotal||0,parcelasPagas:0,primeira:hojeMes(),docs:[]}));
    el.outerHTML='<span class="mono mint">adicionado</span>'; avisar('Lançamento criado'); return; }
  if(a==='del-analise'){ mutar(s=>s.analises=s.analises.filter(x=>x.id!==id)); return; }

  if(a==='salvar-cfg'){
    S.cfg.chave=document.getElementById('k-chave').value.trim();
    S.cfg.modelo=document.getElementById('k-modelo').value.trim();
    S.cfg.endpoint=document.getElementById('k-endpoint').value.trim();
    salvar(); avisar('Ajustes salvos neste aparelho'); return; }
  if(a==='exportar'){ exportarBackup(); return; }
  if(a==='apagar'){ modal('Apagar todos os dados',
    '<p class="sub">Isso remove tudo que está guardado neste aparelho e não pode ser desfeito. Exporte um backup antes, se quiser guardar.</p>',
    '<button class="btn-secundario" data-act="fechar-modal">Cancelar</button><button class="btn-secundario btn-perigo" data-act="apagar-confirma">Apagar definitivamente</button>'); return; }
  if(a==='apagar-confirma'){
    await IDB.limpar('docs'); await IDB.del('kv','dados');
    S={contas:[],despesas:[],investimentos:[],metas:[],nota:'',analises:[],cfg:S.cfg};
    fecharModal(); vista='visao'; render(); avisar('Dados apagados'); return; }
});

document.addEventListener('change', e=>{
  const anexo = e.target.dataset?.anexo;
  if(anexo){ anexar(anexo, e.target.files[0]); e.target.value=''; return; }
  if(e.target.id==='imp' && e.target.files[0]){ importarBackup(e.target.files[0]); e.target.value=''; }
});
document.addEventListener('input', e=>{ if(e.target.id==='nota'){ S.nota=e.target.value; salvar(); } });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') fecharModal();
  const mid = e.target.dataset?.aporte;
  if(mid && e.key==='Enter'){ const v=num(e.target.value); if(v) mutar(s=>{ const m=s.metas.find(x=>x.id===mid); m.acumulado=num(m.acumulado)+v; }); }
});

/* ---------- início ---------- */
(async ()=>{
  try{
    await IDB.abrir();
    const d = await IDB.get('kv','dados');
    if(d) S = { ...S, ...d, cfg:{...S.cfg, ...(d.cfg||{})} };
    await recuperarPasta();
    if(navigator.storage?.persist) navigator.storage.persist().catch(()=>{});
  }catch(e){ avisar('Armazenamento indisponível. Os dados não serão salvos ao fechar.'); }
  render();
})();
</script>
</body>
</html>
